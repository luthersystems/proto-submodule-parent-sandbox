# Dependabot version updates (the quality gate audit of 2026-11-18). Every
# ecosystem is grouped into one PR a month so the updates stay reviewable
# with little noise; security updates for a vulnerable dependency still come
# as soon as GitHub publishes the advisory.
# No gomod entry: go.mod replaces the nested module with the git submodule
# submodules/weather, which Dependabot cannot fetch, so every update would
# fail to resolve.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
